name: Apply Mining Performance Pass

on:
  push:
    branches:
      - feature/mining-performance-pass
    paths:
      - .github/workflows/apply-mining-performance-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mining-performance-pass
      - name: Apply remaining source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 literal match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 regex match in {path}, found {count}")
              p.write_text(updated)

          # Domain geometry: exact gameplay semantics, cheaper evaluation.
          path = "app/src/main/java/com/mineit/minegame/domain/MineWorldGeometry.kt"
          regex_once(
              path,
              r'data class ExcavationClassificationDiagnostics\(.*?\n\)\n\nobject MineWorldGeometry',
              '''data class ExcavationClassificationDiagnostics(
              val elapsedMs: Float = 0f,
              val candidateSamples: Int = 0,
              val newMaterialSamples: Int = 0,
              val nearbyExistingSegments: Int = 0,
              val nearbyOreBodies: Int = 0,
              val existingTunnelChecks: Int = 0,
              val oreFieldEvaluations: Int = 0,
          )

          private data class ExistingTunnelCandidate(
              val segment: TunnelSegment,
              val minX: Float,
              val maxX: Float,
              val minY: Float,
              val maxY: Float,
              val minZ: Float,
              val maxZ: Float,
          ) {
              fun couldContain(point: MinePoint3D): Boolean =
                  point.x >= minX && point.x <= maxX &&
                      point.y >= minY && point.y <= maxY &&
                      point.z >= minZ && point.z <= maxZ
          }

          object MineWorldGeometry'''.replace("          ", ""),
              "diagnostic model",
          )

          regex_once(
              path,
              r'    fun oreMargin\(point: MinePoint3D, oreBody: List<OreBodyNode>\): Float \{.*?\n    \}\n\n    /\*\*\n     \* Signed remaining-ore field\.',
              '''    fun oreMargin(point: MinePoint3D, oreBody: List<OreBodyNode>): Float {
              if (oreBody.size < 2) return Float.NEGATIVE_INFINITY
              var best = Float.NEGATIVE_INFINITY
              for (index in 0 until oreBody.lastIndex) {
                  val start = oreBody[index]
                  val end = oreBody[index + 1]
                  val vx = end.centre.x - start.centre.x
                  val vy = end.centre.y - start.centre.y
                  val vz = end.centre.z - start.centre.z
                  val lengthSquared = (vx * vx) + (vy * vy) + (vz * vz)
                  val t = if (lengthSquared <= 0.0001f) {
                      0f
                  } else {
                      (((point.x - start.centre.x) * vx +
                          (point.y - start.centre.y) * vy +
                          (point.z - start.centre.z) * vz) / lengthSquared).coerceIn(0f, 1f)
                  }
                  val closestX = start.centre.x + (vx * t)
                  val closestY = start.centre.y + (vy * t)
                  val closestZ = start.centre.z + (vz * t)
                  val dx = point.x - closestX
                  val dy = point.y - closestY
                  val dz = point.z - closestZ
                  val radius = start.radiusMetres + ((end.radiusMetres - start.radiusMetres) * t)
                  best = max(best, radius - sqrt((dx * dx) + (dy * dy) + (dz * dz)))
              }
              return best
          }

          fun oreBodyBounds(body: OreBody): MineWorldBounds? {
              if (body.nodes.isEmpty()) return null
              var minX = Float.POSITIVE_INFINITY
              var maxX = Float.NEGATIVE_INFINITY
              var minY = Float.POSITIVE_INFINITY
              var maxY = Float.NEGATIVE_INFINITY
              var minZ = Float.POSITIVE_INFINITY
              var maxZ = Float.NEGATIVE_INFINITY
              body.nodes.forEach { node ->
                  minX = min(minX, node.centre.x - node.radiusMetres)
                  maxX = max(maxX, node.centre.x + node.radiusMetres)
                  minY = min(minY, node.centre.y - node.radiusMetres)
                  maxY = max(maxY, node.centre.y + node.radiusMetres)
                  minZ = min(minZ, node.centre.z - node.radiusMetres)
                  maxZ = max(maxZ, node.centre.z + node.radiusMetres)
              }
              return MineWorldBounds(minX, maxX, minY, maxY, minZ, maxZ)
          }

          /** Conservative bounds rejection only; false guarantees the cutter cannot touch the body. */
          fun segmentMayReachOreBody(
              start: MinePoint3D,
              end: MinePoint3D,
              tunnelRadiusMetres: Float,
              body: OreBody,
          ): Boolean {
              val bounds = oreBodyBounds(body) ?: return false
              return max(start.x, end.x) + tunnelRadiusMetres >= bounds.minX &&
                  min(start.x, end.x) - tunnelRadiusMetres <= bounds.maxX &&
                  max(start.y, end.y) + tunnelRadiusMetres >= bounds.minY &&
                  min(start.y, end.y) - tunnelRadiusMetres <= bounds.maxY &&
                  max(start.z, end.z) + tunnelRadiusMetres >= bounds.minZ &&
                  min(start.z, end.z) - tunnelRadiusMetres <= bounds.maxZ
          }

          /**
           * Signed remaining-ore field.'''.replace("          ", ""),
              "ore margin and bounds",
          )

          regex_once(
              path,
              r'        val nearbyExistingSegments = existingTunnelSegments\.filter \{ existing ->.*?\n        \}\n\n        val sampleVolume =',
              '''        val nearbyExistingSegments = existingTunnelSegments.asSequence()
              .filter { existing ->
                  segmentBoundsOverlap(
                      firstStart = start,
                      firstEnd = end,
                      secondStart = existing.start,
                      secondEnd = existing.end,
                      padding = tunnelRadiusMetres * 2f,
                  )
              }
              .map { existing -> existingTunnelCandidate(existing, tunnelRadiusMetres) }
              .toList()
          val nearbyOreBodies = oreBodies.filter { body ->
              segmentMayReachOreBody(start, end, tunnelRadiusMetres, body)
          }

          val sampleVolume ='''.replace("          ", ""),
              "classification spatial prefilter",
          )

          replace_once(
              path,
              '''                var alreadyExcavated = false
                  for (existing in nearbyExistingSegments) {
                      existingTunnelChecks += 1
                      if (isInsideFiniteCylinder(sample, existing, tunnelRadiusMetres)) {
                          alreadyExcavated = true
                          break
                      }
                  }
          ''',
              '''                var alreadyExcavated = false
                  for (candidate in nearbyExistingSegments) {
                      if (!candidate.couldContain(sample)) continue
                      existingTunnelChecks += 1
                      if (isInsideFiniteCylinder(sample, candidate.segment, tunnelRadiusMetres)) {
                          alreadyExcavated = true
                          break
                      }
                  }
          ''',
              "sample tunnel check",
          )
          replace_once(path, "                oreBodies.forEach { body ->\n", "                nearbyOreBodies.forEach { body ->\n", "nearby ore iteration")
          replace_once(
              path,
              "                nearbyExistingSegments = nearbyExistingSegments.size,\n                existingTunnelChecks = existingTunnelChecks,\n",
              "                nearbyExistingSegments = nearbyExistingSegments.size,\n                nearbyOreBodies = nearbyOreBodies.size,\n                existingTunnelChecks = existingTunnelChecks,\n",
              "nearby ore diagnostics",
          )

          regex_once(
              path,
              r'    private fun isInsideFiniteCylinder\(.*?\n    \}\n\n    private fun segmentBoundsOverlap',
              '''    private fun isInsideFiniteCylinder(
              point: MinePoint3D,
              segment: TunnelSegment,
              radiusMetres: Float,
          ): Boolean {
              val vx = segment.end.x - segment.start.x
              val vy = segment.end.y - segment.start.y
              val vz = segment.end.z - segment.start.z
              val lengthSquared = (vx * vx) + (vy * vy) + (vz * vz)
              if (lengthSquared <= 0.0001f) {
                  val dx = point.x - segment.start.x
                  val dy = point.y - segment.start.y
                  val dz = point.z - segment.start.z
                  return (dx * dx) + (dy * dy) + (dz * dz) <= radiusMetres * radiusMetres
              }
              val t = (((point.x - segment.start.x) * vx +
                  (point.y - segment.start.y) * vy +
                  (point.z - segment.start.z) * vz) / lengthSquared)
              if (t < 0f || t > 1f) return false
              val dx = point.x - (segment.start.x + (vx * t))
              val dy = point.y - (segment.start.y + (vy * t))
              val dz = point.z - (segment.start.z + (vz * t))
              return (dx * dx) + (dy * dy) + (dz * dz) <= radiusMetres * radiusMetres
          }

          private fun existingTunnelCandidate(
              segment: TunnelSegment,
              radiusMetres: Float,
          ): ExistingTunnelCandidate = ExistingTunnelCandidate(
              segment = segment,
              minX = min(segment.start.x, segment.end.x) - radiusMetres,
              maxX = max(segment.start.x, segment.end.x) + radiusMetres,
              minY = min(segment.start.y, segment.end.y) - radiusMetres,
              maxY = max(segment.start.y, segment.end.y) + radiusMetres,
              minZ = min(segment.start.z, segment.end.z) - radiusMetres,
              maxZ = max(segment.start.z, segment.end.z) + radiusMetres,
          )

          private fun segmentBoundsOverlap'''.replace("          ", ""),
              "finite cylinder direct math",
          )

          # Controller: skip discovery scans for geometrically irrelevant bodies.
          path = "app/src/main/java/com/mineit/minegame/domain/MineWorldController.kt"
          regex_once(
              path,
              r'        var classificationDiagnostics = ExcavationClassificationDiagnostics\([^\n]*\)',
              '        var classificationDiagnostics = ExcavationClassificationDiagnostics()',
              "default classification diagnostics",
          )
          replace_once(
              path,
              '''            .filter { body ->
                  body.id in minedBodyIds ||
                      MineWorldGeometry.exposedOreSegmentsForSegment(
                          start = start,
                          end = target,
                          tunnelRadiusMetres = state.tunnel.radiusMetres,
                          oreBody = body.nodes,
                      ).isNotEmpty()
              }
          ''',
              '''            .filter { body ->
                  body.id in minedBodyIds ||
                      (
                          MineWorldGeometry.segmentMayReachOreBody(
                              start = start,
                              end = target,
                              tunnelRadiusMetres = state.tunnel.radiusMetres,
                              body = body,
                          ) &&
                              MineWorldGeometry.exposedOreSegmentsForSegment(
                                  start = start,
                                  end = target,
                                  tunnelRadiusMetres = state.tunnel.radiusMetres,
                                  oreBody = body.nodes,
                              ).isNotEmpty()
                          )
              }
          ''',
              "discovery prefilter",
          )

          # Renderer: urgent live ore, lazy reveal/fine refinement.
          path = "app/src/main/java/com/mineit/minegame/ui/render/MineWorldGlRenderer.kt"
          replace_once(path, "    val queuedOreChunks: Int = 0,\n", "    val queuedOreChunks: Int = 0,\n    val queuedOreBackgroundChunks: Int = 0,\n", "background queue stat")
          replace_once(
              path,
              '''    private data class CachedChunk(
              val mesh: GlMesh?,
              val gridStepMetres: Float,
          )
          ''',
              '''    private data class CachedChunk(
              val mesh: GlMesh?,
              val gridStepMetres: Float,
          )

          private data class CachedOreChunk(
              val mesh: GlMesh?,
              val gridStepMetres: Float,
          )
          ''',
              "cached ore model",
          )
          replace_once(
              path,
              '''    private val oreChunkMeshes = linkedMapOf<OreChunkKey, GlMesh?>()
              private val pendingOreChunkBuilds = linkedMapOf<OreChunkKey, Float>()
              private val activeOreDirtyChunks = linkedSetOf<OreChunkKey>()
              private val oreChunkRevisions = mutableMapOf<OreChunkKey, Long>()
              private val appliedOreChunkRevisions = mutableMapOf<OreChunkKey, Long>()
              private val oreChunksTouchedDuringDigging = linkedSetOf<OreChunkKey>()
          ''',
              '''    private val oreChunkMeshes = linkedMapOf<OreChunkKey, CachedOreChunk>()
              private val pendingOreChunkBuilds = linkedMapOf<OreChunkKey, Float>()
              private val oreRevealCandidates = linkedSetOf<OreChunkKey>()
              private val oreRefinementCandidates = linkedSetOf<OreChunkKey>()
              private val activeOreDirtyChunks = linkedSetOf<OreChunkKey>()
              private val oreChunkRevisions = mutableMapOf<OreChunkKey, Long>()
              private val appliedOreChunkRevisions = mutableMapOf<OreChunkKey, Long>()
          ''',
              "ore cache collections",
          )
          p = Path(path)
          text = p.read_text()
          text = text.replace("        oreChunksTouchedDuringDigging.clear()\n", "")
          text = text.replace("        oreChunkMeshes.values.forEach(::deleteMesh)\n", "        oreChunkMeshes.values.forEach { deleteMesh(it.mesh) }\n")
          text = text.replace("            oreChunkMeshes.values.forEach(::drawMesh)\n", "            oreChunkMeshes.values.forEach { drawMesh(it.mesh) }\n")
          p.write_text(text)

          replace_once(
              path,
              '''        oreChunkMeshes.clear()
              pendingOreChunkBuilds.clear()
              activeOreDirtyChunks.clear()
          ''',
              '''        oreChunkMeshes.clear()
              pendingOreChunkBuilds.clear()
              oreRevealCandidates.clear()
              oreRefinementCandidates.clear()
              activeOreDirtyChunks.clear()
          ''',
              "reset lazy ore queues",
          )
          replace_once(
              path,
              '''                state.discoveredOreBodies.forEach { body ->
                      val affectedOre = OreChunkPlanner.affectedChunks(
                          segment = segment,
                          tunnelRadiusMetres = state.tunnel.radiusMetres,
                          body = body,
                          worldBounds = state.bounds,
                          extraPaddingMetres = LIVE_ORE_GRID_STEP_METRES,
                      )
                      oreChunksTouchedDuringDigging += affectedOre
                      activeOreDirtyChunks += affectedOre
                  }
          ''',
              '''                state.discoveredOreBodies.forEach { body ->
                      val affectedOre = OreChunkPlanner.affectedChunks(
                          segment = segment,
                          tunnelRadiusMetres = state.tunnel.radiusMetres,
                          body = body,
                          worldBounds = state.bounds,
                          extraPaddingMetres = LIVE_ORE_GRID_STEP_METRES,
                      )
                      affectedOre.forEach { key ->
                          oreRevealCandidates.remove(key)
                          oreRefinementCandidates.remove(key)
                      }
                      activeOreDirtyChunks += affectedOre
                  }
          ''',
              "active ore invalidation",
          )
          regex_once(
              path,
              r'            oreChunksTouchedDuringDigging\.forEach \{ key ->.*?            activeOreDirtyChunks\.clear\(\)\n',
              '''            activeOreDirtyChunks.forEach { key ->
                  markOreChunkForBuild(key, LIVE_ORE_GRID_STEP_METRES, replaceExisting = true)
              }
              activeOreDirtyChunks.clear()
          '''.replace("          ", ""),
              "stop-time coarse only",
          )
          regex_once(
              path,
              r'        if \(state\.discoveredOreBodyIds != previous\.discoveredOreBodyIds\) \{.*?\n        \}\n\n        processedState = state',
              '''        if (state.discoveredOreBodyIds != previous.discoveredOreBodyIds) {
              sliceDirty = true
              oreSliceDirty = true
              oreCacheDirty = true
          }

          processedState = state'''.replace("          ", ""),
              "discovery lazy reveal",
          )
          regex_once(
              path,
              r'    private fun queueOreRebuildsIfNeeded\(state: MineWorldState\) \{.*?\n    \}\n\n    private fun markOreChunkForBuild',
              '''    private fun queueOreRebuildsIfNeeded(state: MineWorldState) {
              if (!oreCacheDirty) return
              state.discoveredOreBodies.forEach { body ->
                  OreChunkPlanner.chunksForBody(body, state.bounds).forEach { key ->
                      if (key !in oreChunkMeshes && key !in pendingOreChunkBuilds) {
                          oreRevealCandidates += key
                      }
                  }
              }
              oreCacheDirty = false
          }

          private fun markOreChunkForBuild'''.replace("          ", ""),
              "lazy ore queue setup",
          )
          replace_once(
              path,
              '''    ) {
              val existing = pendingOreChunkBuilds[key]
              pendingOreChunkBuilds[key] = when {
          ''',
              '''    ) {
              oreRevealCandidates.remove(key)
              oreRefinementCandidates.remove(key)
              val existing = pendingOreChunkBuilds[key]
              pendingOreChunkBuilds[key] = when {
          ''',
              "urgent queue removes lazy candidates",
          )
          replace_once(
              path,
              '''            val previous = oreChunkMeshes.put(result.key, uploaded)
              deleteMesh(previous)
              appliedOreChunkRevisions[result.key] = result.revision
              lastOreChunkBuildMs = result.buildMs
              lastOreGridStepMetres = result.gridStepMetres
              peakOreChunkBuildMs = max(peakOreChunkBuildMs, result.buildMs)
              oreChunksRebuiltSinceStats += 1
          ''',
              '''            val previous = oreChunkMeshes.put(
                  result.key,
                  CachedOreChunk(mesh = uploaded, gridStepMetres = result.gridStepMetres),
              )
              deleteMesh(previous?.mesh)
              appliedOreChunkRevisions[result.key] = result.revision
              lastOreChunkBuildMs = result.buildMs
              lastOreGridStepMetres = result.gridStepMetres
              peakOreChunkBuildMs = max(peakOreChunkBuildMs, result.buildMs)
              oreChunksRebuiltSinceStats += 1
              if (result.gridStepMetres > OreMeshBuilder.BODY_GRID_STEP_METRES + 0.01f) {
                  oreRefinementCandidates += result.key
              } else {
                  oreRefinementCandidates.remove(result.key)
              }
          ''',
              "cache ore build result",
          )
          regex_once(
              path,
              r'    private fun scheduleNextOreChunkBuild\(state: MineWorldState\) \{.*?\n    \}\n\n    private fun scheduleNextChunkBuilds',
              '''    private fun scheduleNextOreChunkBuild(state: MineWorldState) {
              if (meshBuildCoordinator.availableOreSlots() <= 0) return

              val urgent = pendingOreChunkBuilds.entries.minByOrNull { entry ->
                  MineWorldGeometry.distance(OreChunkPlanner.chunkCentre(entry.key), state.tunnel.end)
              }
              if (urgent != null) {
                  val revision = oreChunkRevisions[urgent.key] ?: return
                  if (submitOreChunkBuild(state, urgent.key, urgent.value, revision)) {
                      pendingOreChunkBuilds.remove(urgent.key)
                  }
                  return
              }

              if (state.isDigging) return
              val lazyKey = (oreRevealCandidates + oreRefinementCandidates).minByOrNull { candidate ->
                  MineWorldGeometry.distance(OreChunkPlanner.chunkCentre(candidate), state.tunnel.end)
              } ?: return
              val gridStep = if (lazyKey in oreRevealCandidates) {
                  LIVE_ORE_GRID_STEP_METRES
              } else {
                  OreMeshBuilder.BODY_GRID_STEP_METRES
              }
              val revision = (oreChunkRevisions[lazyKey] ?: 0L) + 1L
              oreChunkRevisions[lazyKey] = revision
              if (submitOreChunkBuild(state, lazyKey, gridStep, revision)) {
                  oreRevealCandidates.remove(lazyKey)
                  oreRefinementCandidates.remove(lazyKey)
              }
          }

          private fun submitOreChunkBuild(
              state: MineWorldState,
              key: OreChunkKey,
              gridStepMetres: Float,
              revision: Long,
          ): Boolean {
              val body = state.oreBodies.firstOrNull { it.id == key.bodyId }
              if (body == null || key !in OreChunkPlanner.chunksForBody(body, state.bounds)) {
                  pendingOreChunkBuilds.remove(key)
                  oreRevealCandidates.remove(key)
                  oreRefinementCandidates.remove(key)
                  return false
              }
              return meshBuildCoordinator.trySubmitOreChunk(
                  OreChunkBuildRequest(
                      pipelineGeneration = pipelineGeneration,
                      revision = revision,
                      key = key,
                      state = state,
                      body = body,
                      gridStepMetres = gridStepMetres,
                  ),
              )
          }

          private fun scheduleNextChunkBuilds'''.replace("          ", ""),
              "lazy ore scheduler",
          )
          replace_once(path, "        val oreVertices = oreChunkMeshes.values.sumOf { it?.vertexCount ?: 0 } +\n", "        val oreVertices = oreChunkMeshes.values.sumOf { it.mesh?.vertexCount ?: 0 } +\n", "ore vertex stats")
          replace_once(path, "                cachedOreChunks = oreChunkMeshes.values.count { it != null },\n", "                cachedOreChunks = oreChunkMeshes.size,\n", "cached ore count")
          replace_once(path, "                queuedOreChunks = pendingOreChunkBuilds.size,\n", "                queuedOreChunks = pendingOreChunkBuilds.size,\n                queuedOreBackgroundChunks = oreRevealCandidates.size + oreRefinementCandidates.size,\n", "background queue reporting")

          # Screen/log wiring.
          path = "app/src/main/java/com/mineit/minegame/ui/MineWorldScreen.kt"
          replace_once(path, "    val latestTick by rememberUpdatedState(tickDiagnostics?.diagnostics)\n", "    val latestTick by rememberUpdatedState(tickDiagnostics)\n", "latest sequenced tick")
          replace_once(
              path,
              '''        val tick = tickDiagnostics?.diagnostics ?: return@LaunchedEffect
              if (tick.totalMs >= 20f || tick.materialMs >= 20f || tick.discoveryMs >= 20f) {
                  diagnosticsLog.record("tick_spike", state, performanceStats, tick)
          ''',
              '''        val sequenced = tickDiagnostics ?: return@LaunchedEffect
              val tick = sequenced.diagnostics
              if (tick.totalMs >= 20f || tick.materialMs >= 20f || tick.discoveryMs >= 20f || sequenced.schedulerLateMs >= 20f) {
                  diagnosticsLog.record("tick_spike", state, performanceStats, sequenced)
          ''',
              "scheduler spike logging",
          )
          replace_once(path, '            diagnosticsLog.record("mesh_event", state, performanceStats, tickDiagnostics?.diagnostics)\n', '            diagnosticsLog.record("mesh_event", state, performanceStats, tickDiagnostics)\n', "mesh logging")
          replace_once(path, '                    text = "LIVE ORE + DIAGNOSTIC CAPTURE",\n', '                    text = "ASYNC MINING + LAZY ORE REFINEMENT",\n', "header subtitle")
          replace_once(path, '            append("q R${stats.queuedChunks}/O${stats.queuedOreChunks}  workers R${if (stats.meshWorkerBusy) "BUSY" else "IDLE"}/O${if (stats.oreWorkerBusy) "BUSY" else "IDLE"}")\n', '            append("q R${stats.queuedChunks}/O${stats.queuedOreChunks} bg${stats.queuedOreBackgroundChunks}  workers R${if (stats.meshWorkerBusy) "BUSY" else "IDLE"}/O${if (stats.oreWorkerBusy) "BUSY" else "IDLE"}")\n', "overlay background queue")
          replace_once(path, '            "ore ${performanceStats.cachedOreChunks}ch/${performanceStats.queuedOreChunks}q",\n', '            "ore ${performanceStats.cachedOreChunks}ch/${performanceStats.queuedOreChunks}q/${performanceStats.queuedOreBackgroundChunks}bg",\n', "other panel background queue")
          replace_once(path, '        text = "Excavation is partitioned once into mined ore or waste rock; remaining ore is original geology minus the cutter volume, and only locally affected ore chunks are remeshed after a pass.",\n', '        text = "Mining classification runs off the UI thread at a fixed 10 Hz deadline. Live ore cuts use urgent coarse chunks; full reveal and 0.6m refinement are lazy idle work.",\n', "other panel explanation")

          # Regression tests.
          path = "app/src/test/java/com/mineit/minegame/domain/MineWorldControllerTest.kt"
          marker = '''    @Test
              fun `tick diagnostics report material work without changing accounting`() {
          '''.replace("          ", "")
          insertion = '''    @Test
              fun classificationRejectsFarOreBodiesBeforeFieldEvaluation() {
                  val near = OreBody(
                      id = "near",
                      type = OreType.COPPER,
                      nodes = listOf(
                          OreBodyNode(MinePoint3D(0f, 0f, 4f), 4f),
                          OreBodyNode(MinePoint3D(0f, 0f, 12f), 4f),
                      ),
                  )
                  val far = OreBody(
                      id = "far",
                      type = OreType.GOLD,
                      nodes = listOf(
                          OreBodyNode(MinePoint3D(200f, 200f, 4f), 4f),
                          OreBodyNode(MinePoint3D(200f, 200f, 12f), 4f),
                      ),
                  )
                  var diagnostics: ExcavationClassificationDiagnostics? = null
                  val material = MineWorldGeometry.classifyNewExcavation(
                      start = MinePoint3D(0f, 0f, 4f),
                      end = MinePoint3D(0f, 0f, 5f),
                      tunnelRadiusMetres = 3.2f,
                      existingTunnelSegments = emptyList(),
                      oreBodies = listOf(near, far),
                      onDiagnostics = { diagnostics = it },
                  )

                  val measured = requireNotNull(diagnostics)
                  assertEquals(1, measured.nearbyOreBodies)
                  assertTrue(measured.oreFieldEvaluations <= measured.newMaterialSamples)
                  assertTrue(material.oreVolumeCubicMetres > 0f)
                  assertEquals(
                      material.newExcavatedVolumeCubicMetres,
                      material.wasteRockVolumeCubicMetres + material.oreVolumeCubicMetres,
                      0.001f,
                  )
              }

          '''.replace("          ", "")
          replace_once(path, marker, insertion + marker, "classification regression")

          path = "app/src/test/java/com/mineit/minegame/ui/render/OreChunkPlannerTest.kt"
          marker = '''    @Test
              fun bodyGridAlignsExactlyWithOreChunkEdges() {
          '''.replace("          ", "")
          insertion = '''    @Test
