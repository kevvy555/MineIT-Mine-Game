name: Apply Mining Performance Pass

on:
  push:
    branches:
      - feature/mining-performance-pass
    paths:
      - .github/workflows/apply-mining-performance-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mining-performance-pass
      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # --- Domain geometry: same truth, substantially cheaper exact checks. ---
          path = "app/src/main/java/com/mineit/minegame/domain/MineWorldGeometry.kt"
          replace_once(path,
          '''data class ExcavationClassificationDiagnostics(
              val elapsedMs: Float,
              val candidateSamples: Int,
              val newMaterialSamples: Int,
              val nearbyExistingSegments: Int,
              val existingTunnelChecks: Int,
              val oreFieldEvaluations: Int,
          )
          ''',
          '''data class ExcavationClassificationDiagnostics(
              val elapsedMs: Float = 0f,
              val candidateSamples: Int = 0,
              val newMaterialSamples: Int = 0,
              val nearbyExistingSegments: Int = 0,
              val nearbyOreBodies: Int = 0,
              val existingTunnelChecks: Int = 0,
              val oreFieldEvaluations: Int = 0,
          )

          private data class ExistingTunnelCandidate(
              val segment: TunnelSegment,
              val minX: Float,
              val maxX: Float,
              val minY: Float,
              val maxY: Float,
              val minZ: Float,
              val maxZ: Float,
          ) {
              fun couldContain(point: MinePoint3D): Boolean =
                  point.x >= minX && point.x <= maxX &&
                      point.y >= minY && point.y <= maxY &&
                      point.z >= minZ && point.z <= maxZ
          }
          ''')

          old_ore_margin = '''    fun oreMargin(point: MinePoint3D, oreBody: List<OreBodyNode>): Float {
              if (oreBody.size < 2) return Float.NEGATIVE_INFINITY
              var best = Float.NEGATIVE_INFINITY
              oreBody.zipWithNext().forEach { (start, end) ->
                  val t = closestParameter(point, start.centre, end.centre)
                  val closest = interpolate(start.centre, end.centre, t)
                  val radius = start.radiusMetres + ((end.radiusMetres - start.radiusMetres) * t)
                  best = max(best, radius - distance(point, closest))
              }
              return best
          }
          '''
          new_ore_margin = '''    fun oreMargin(point: MinePoint3D, oreBody: List<OreBodyNode>): Float {
              if (oreBody.size < 2) return Float.NEGATIVE_INFINITY
              var best = Float.NEGATIVE_INFINITY
              for (index in 0 until oreBody.lastIndex) {
                  val start = oreBody[index]
                  val end = oreBody[index + 1]
                  val vx = end.centre.x - start.centre.x
                  val vy = end.centre.y - start.centre.y
                  val vz = end.centre.z - start.centre.z
                  val lengthSquared = (vx * vx) + (vy * vy) + (vz * vz)
                  val t = if (lengthSquared <= 0.0001f) {
                      0f
                  } else {
                      (((point.x - start.centre.x) * vx +
                          (point.y - start.centre.y) * vy +
                          (point.z - start.centre.z) * vz) / lengthSquared).coerceIn(0f, 1f)
                  }
                  val closestX = start.centre.x + (vx * t)
                  val closestY = start.centre.y + (vy * t)
                  val closestZ = start.centre.z + (vz * t)
                  val dx = point.x - closestX
                  val dy = point.y - closestY
                  val dz = point.z - closestZ
                  val radius = start.radiusMetres + ((end.radiusMetres - start.radiusMetres) * t)
                  best = max(best, radius - sqrt((dx * dx) + (dy * dy) + (dz * dz)))
              }
              return best
          }

          fun oreBodyBounds(body: OreBody): MineWorldBounds? {
              if (body.nodes.isEmpty()) return null
              var minX = Float.POSITIVE_INFINITY
              var maxX = Float.NEGATIVE_INFINITY
              var minY = Float.POSITIVE_INFINITY
              var maxY = Float.NEGATIVE_INFINITY
              var minZ = Float.POSITIVE_INFINITY
              var maxZ = Float.NEGATIVE_INFINITY
              body.nodes.forEach { node ->
                  minX = min(minX, node.centre.x - node.radiusMetres)
                  maxX = max(maxX, node.centre.x + node.radiusMetres)
                  minY = min(minY, node.centre.y - node.radiusMetres)
                  maxY = max(maxY, node.centre.y + node.radiusMetres)
                  minZ = min(minZ, node.centre.z - node.radiusMetres)
                  maxZ = max(maxZ, node.centre.z + node.radiusMetres)
              }
              return MineWorldBounds(minX, maxX, minY, maxY, minZ, maxZ)
          }

          /** Conservative bounds rejection only; a false result guarantees the cutter cannot touch this body. */
          fun segmentMayReachOreBody(
              start: MinePoint3D,
              end: MinePoint3D,
              tunnelRadiusMetres: Float,
              body: OreBody,
          ): Boolean {
              val bounds = oreBodyBounds(body) ?: return false
              return max(start.x, end.x) + tunnelRadiusMetres >= bounds.minX &&
                  min(start.x, end.x) - tunnelRadiusMetres <= bounds.maxX &&
                  max(start.y, end.y) + tunnelRadiusMetres >= bounds.minY &&
                  min(start.y, end.y) - tunnelRadiusMetres <= bounds.maxY &&
                  max(start.z, end.z) + tunnelRadiusMetres >= bounds.minZ &&
                  min(start.z, end.z) - tunnelRadiusMetres <= bounds.maxZ
          }
          '''
          replace_once(path, old_ore_margin, new_ore_margin)

          replace_once(path,
          '''        val nearbyExistingSegments = existingTunnelSegments.filter { existing ->
              segmentBoundsOverlap(
                  firstStart = start,
                  firstEnd = end,
                  secondStart = existing.start,
                  secondEnd = existing.end,
                  padding = tunnelRadiusMetres * 2f,
              )
          }

          val sampleVolume = cylinderVolume(tunnelRadiusMetres, length) /
          ''',
          '''        val nearbyExistingSegments = existingTunnelSegments.asSequence()
              .filter { existing ->
                  segmentBoundsOverlap(
                      firstStart = start,
                      firstEnd = end,
                      secondStart = existing.start,
                      secondEnd = existing.end,
                      padding = tunnelRadiusMetres * 2f,
                  )
              }
              .map { existing -> existingTunnelCandidate(existing, tunnelRadiusMetres) }
              .toList()
          val nearbyOreBodies = oreBodies.filter { body ->
              segmentMayReachOreBody(start, end, tunnelRadiusMetres, body)
          }

          val sampleVolume = cylinderVolume(tunnelRadiusMetres, length) /
          ''')

          replace_once(path,
          '''                var alreadyExcavated = false
                  for (existing in nearbyExistingSegments) {
                      existingTunnelChecks += 1
                      if (isInsideFiniteCylinder(sample, existing, tunnelRadiusMetres)) {
                          alreadyExcavated = true
                          break
                      }
                  }
          ''',
          '''                var alreadyExcavated = false
                  for (candidate in nearbyExistingSegments) {
                      if (!candidate.couldContain(sample)) continue
                      existingTunnelChecks += 1
                      if (isInsideFiniteCylinder(sample, candidate.segment, tunnelRadiusMetres)) {
                          alreadyExcavated = true
                          break
                      }
                  }
          ''')

          replace_once(path,
          '''                oreBodies.forEach { body ->
                      oreFieldEvaluations += 1
                      val margin = oreMargin(sample, body.nodes)
          ''',
          '''                nearbyOreBodies.forEach { body ->
                      oreFieldEvaluations += 1
                      val margin = oreMargin(sample, body.nodes)
          ''')

          replace_once(path,
          '''                nearbyExistingSegments = nearbyExistingSegments.size,
                      existingTunnelChecks = existingTunnelChecks,
          ''',
          '''                nearbyExistingSegments = nearbyExistingSegments.size,
                      nearbyOreBodies = nearbyOreBodies.size,
                      existingTunnelChecks = existingTunnelChecks,
          ''')

          replace_once(path,
          '''    private fun isInsideFiniteCylinder(
              point: MinePoint3D,
              segment: TunnelSegment,
              radiusMetres: Float,
          ): Boolean {
              val t = projectionParameter(point, segment.start, segment.end)
              if (t < 0f || t > 1f) return false
              val closest = interpolate(segment.start, segment.end, t)
              return distance(point, closest) <= radiusMetres
          }
          ''',
          '''    private fun isInsideFiniteCylinder(
              point: MinePoint3D,
              segment: TunnelSegment,
              radiusMetres: Float,
          ): Boolean {
              val vx = segment.end.x - segment.start.x
              val vy = segment.end.y - segment.start.y
              val vz = segment.end.z - segment.start.z
              val lengthSquared = (vx * vx) + (vy * vy) + (vz * vz)
              if (lengthSquared <= 0.0001f) {
                  val dx = point.x - segment.start.x
                  val dy = point.y - segment.start.y
                  val dz = point.z - segment.start.z
                  return (dx * dx) + (dy * dy) + (dz * dz) <= radiusMetres * radiusMetres
              }
              val t = (((point.x - segment.start.x) * vx +
                  (point.y - segment.start.y) * vy +
                  (point.z - segment.start.z) * vz) / lengthSquared)
              if (t < 0f || t > 1f) return false
              val dx = point.x - (segment.start.x + (vx * t))
              val dy = point.y - (segment.start.y + (vy * t))
              val dz = point.z - (segment.start.z + (vz * t))
              return (dx * dx) + (dy * dy) + (dz * dz) <= radiusMetres * radiusMetres
          }

          private fun existingTunnelCandidate(
              segment: TunnelSegment,
              radiusMetres: Float,
          ): ExistingTunnelCandidate = ExistingTunnelCandidate(
              segment = segment,
              minX = min(segment.start.x, segment.end.x) - radiusMetres,
              maxX = max(segment.start.x, segment.end.x) + radiusMetres,
              minY = min(segment.start.y, segment.end.y) - radiusMetres,
              maxY = max(segment.start.y, segment.end.y) + radiusMetres,
              minZ = min(segment.start.z, segment.end.z) - radiusMetres,
              maxZ = max(segment.start.z, segment.end.z) + radiusMetres,
          )
          ''')

          # --- Controller: skip expensive discovery scans for bodies the cutter cannot reach. ---
          path = "app/src/main/java/com/mineit/minegame/domain/MineWorldController.kt"
          replace_once(path,
          '''        var classificationDiagnostics = ExcavationClassificationDiagnostics(0f, 0, 0, 0, 0, 0)
          ''',
          '''        var classificationDiagnostics = ExcavationClassificationDiagnostics()
          ''')
          replace_once(path,
          '''            .filter { body ->
                  body.id in minedBodyIds ||
                      MineWorldGeometry.exposedOreSegmentsForSegment(
                          start = start,
                          end = target,
                          tunnelRadiusMetres = state.tunnel.radiusMetres,
                          oreBody = body.nodes,
                      ).isNotEmpty()
              }
          ''',
          '''            .filter { body ->
                  body.id in minedBodyIds ||
                      (
                          MineWorldGeometry.segmentMayReachOreBody(
                              start = start,
                              end = target,
                              tunnelRadiusMetres = state.tunnel.radiusMetres,
                              body = body,
                          ) &&
                              MineWorldGeometry.exposedOreSegmentsForSegment(
                                  start = start,
                                  end = target,
                                  tunnelRadiusMetres = state.tunnel.radiusMetres,
                                  oreBody = body.nodes,
                              ).isNotEmpty()
                          )
              }
          ''')

          # --- ViewModel: fixed-deadline loop, heavy deterministic tick off the main thread. ---
          Path("app/src/main/java/com/mineit/minegame/ui/MineWorldViewModel.kt").write_text('''package com.mineit.minegame.ui

          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import com.mineit.minegame.domain.MineTickDiagnostics
          import com.mineit.minegame.domain.MineWorldController
          import com.mineit.minegame.domain.MineWorldState
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock
          import kotlinx.coroutines.withContext

          data class SequencedTickDiagnostics(
              val sequence: Long,
              val diagnostics: MineTickDiagnostics,
              val schedulerLateMs: Float,
              val tickIntervalMs: Float,
          )

          class MineWorldViewModel : ViewModel() {
              private val mutableState = MutableStateFlow(MineWorldState())
              val state: StateFlow<MineWorldState> = mutableState.asStateFlow()
              private val mutableTickDiagnostics = MutableStateFlow<SequencedTickDiagnostics?>(null)
              val tickDiagnostics: StateFlow<SequencedTickDiagnostics?> = mutableTickDiagnostics.asStateFlow()

              private val stateMutex = Mutex()
              private var diggingJob: Job? = null
              private var tickSequence = 0L

              fun setSteering(value: Float) = updateDomainState { MineWorldController.setSteering(it, value) }

              fun setVerticalAngle(degrees: Float) = updateDomainState {
                  MineWorldController.setVerticalAngle(it, degrees)
              }

              fun setDigSpeedMultiplier(multiplier: Float) = updateDomainState {
                  MineWorldController.setDigSpeedMultiplier(it, multiplier)
              }

              fun turnHeadingBy(degrees: Float) = updateDomainState {
                  MineWorldController.turnHeadingBy(it, degrees)
              }

              fun toggleDigging() {
                  viewModelScope.launch {
                      stateMutex.withLock {
                          val current = mutableState.value
                          if (current.isDigging) {
                              diggingJob?.cancel()
                              diggingJob = null
                              mutableState.value = MineWorldController.stopDigging(current)
                          } else {
                              val started = MineWorldController.startDigging(current)
                              mutableState.value = started
                              if (started.isDigging) startDiggingLoop()
                          }
                      }
                  }
              }

              fun reset() {
                  diggingJob?.cancel()
                  diggingJob = null
                  viewModelScope.launch {
                      stateMutex.withLock {
                          mutableState.value = MineWorldController.reset()
                          mutableTickDiagnostics.value = null
                          tickSequence = 0L
                      }
                  }
              }

              private fun updateDomainState(transform: (MineWorldState) -> MineWorldState) {
                  viewModelScope.launch {
                      stateMutex.withLock {
                          mutableState.value = transform(mutableState.value)
                      }
                  }
              }

              private fun startDiggingLoop() {
                  diggingJob?.cancel()
                  diggingJob = viewModelScope.launch {
                      var nextDeadlineNanos = System.nanoTime() + DIG_TICK_NANOS
                      var previousCompletionNanos = System.nanoTime()

                      while (isActive) {
                          delayUntil(nextDeadlineNanos)
                          val tickStartedNanos = System.nanoTime()
                          val schedulerLateMs = ((tickStartedNanos - nextDeadlineNanos).coerceAtLeast(0L)) / 1_000_000f
                          var diagnostics: MineTickDiagnostics? = null

                          stateMutex.lock()
                          try {
                              val snapshot = mutableState.value
                              if (!snapshot.isDigging) break
                              val nextState = withContext(Dispatchers.Default) {
                                  MineWorldController.tick(snapshot, DIG_TICK_SECONDS) { diagnostics = it }
                              }
                              mutableState.value = nextState
                          } finally {
                              stateMutex.unlock()
                          }

                          val completedNanos = System.nanoTime()
                          diagnostics?.let { value ->
                              tickSequence += 1
                              mutableTickDiagnostics.value = SequencedTickDiagnostics(
                                  sequence = tickSequence,
                                  diagnostics = value,
                                  schedulerLateMs = schedulerLateMs,
                                  tickIntervalMs = (completedNanos - previousCompletionNanos) / 1_000_000f,
                              )
                          }
                          previousCompletionNanos = completedNanos
                          if (!mutableState.value.isDigging) break

                          nextDeadlineNanos += DIG_TICK_NANOS
                          if (nextDeadlineNanos <= completedNanos) {
                              val missedIntervals = ((completedNanos - nextDeadlineNanos) / DIG_TICK_NANOS) + 1L
                              nextDeadlineNanos += missedIntervals * DIG_TICK_NANOS
                          }
                      }
                  }
              }

              private suspend fun delayUntil(deadlineNanos: Long) {
                  val remainingNanos = deadlineNanos - System.nanoTime()
                  if (remainingNanos > 0L) {
                      delay((remainingNanos + 999_999L) / 1_000_000L)
                  }
              }

              private companion object {
                  const val DIG_TICK_MILLIS = 100L
                  const val DIG_TICK_NANOS = DIG_TICK_MILLIS * 1_000_000L
                  const val DIG_TICK_SECONDS = 0.10f
              }
          }
          '''.replace("          ", ""))

          # --- Diagnostics CSV: retain 1s sampling, add scheduler/spatial/refinement evidence. ---
          Path("app/src/main/java/com/mineit/minegame/ui/MineDiagnosticsLog.kt").write_text('''package com.mineit.minegame.ui

          import com.mineit.minegame.domain.MineWorldState
          import com.mineit.minegame.ui.render.RenderPerformanceStats
          import java.util.Locale

          internal class MineDiagnosticsLog(private val startedAtMillis: Long = System.currentTimeMillis()) {
              private val rows = mutableListOf<String>()
              val recordCount: Int get() = rows.size

              @Synchronized
              fun record(
                  event: String,
                  state: MineWorldState,
                  render: RenderPerformanceStats,
                  tick: SequencedTickDiagnostics?,
                  nowMillis: Long = System.currentTimeMillis(),
              ) {
                  val domainTick = tick?.diagnostics
                  rows += listOf(
                      nowMillis - startedAtMillis, event, state.isDigging, f(state.depthMetres), f(state.excavatedVolumeCubicMetres),
                      f(state.totalMinedOreVolumeCubicMetres), render.framesPerSecond, f(render.frameTimeMs), f(render.lastChunkBuildMs),
                      f(render.lastOreChunkBuildMs), f(render.lastOreGridStepMetres), f(render.lastCapBuildMs), f(render.lastUploadMs),
                      render.triangleCount, render.oreTriangleCount, render.cachedChunks, render.cachedOreChunks, render.queuedChunks,
                      render.queuedOreChunks, render.queuedOreBackgroundChunks, render.meshWorkerBusy, render.oreWorkerBusy,
                      f(domainTick?.totalMs), f(domainTick?.materialMs), f(domainTick?.discoveryMs), f(tick?.schedulerLateMs),
                      f(tick?.tickIntervalMs), domainTick?.classification?.candidateSamples ?: 0,
                      domainTick?.classification?.newMaterialSamples ?: 0,
                      domainTick?.classification?.nearbyExistingSegments ?: 0,
                      domainTick?.classification?.nearbyOreBodies ?: 0,
                      domainTick?.classification?.existingTunnelChecks ?: 0,
                      domainTick?.classification?.oreFieldEvaluations ?: 0, f(domainTick?.segmentLengthMetres),
                      f(domainTick?.newExcavatedVolumeCubicMetres), f(domainTick?.oreVolumeCubicMetres),
                      f(domainTick?.wasteRockVolumeCubicMetres),
                  ).joinToString(",")
              }

              @Synchronized fun clear() = rows.clear()
              @Synchronized fun toCsv(): String = buildString {
                  appendLine("elapsed_ms,event,digging,depth_m,removed_m3,ore_m3,fps,frame_ms,rock_mesh_ms,ore_mesh_ms,ore_grid_m,cap_ms,upload_ms,triangles,ore_triangles,rock_chunks,ore_chunks,rock_queue,ore_queue,ore_background_queue,rock_busy,ore_busy,tick_ms,material_ms,discovery_ms,scheduler_late_ms,tick_interval_ms,candidate_samples,new_samples,nearby_tunnel_segments,nearby_ore_bodies,tunnel_checks,ore_field_evals,segment_m,new_volume_m3,tick_ore_m3,tick_waste_m3")
                  rows.forEach(::appendLine)
              }

              private fun f(value: Float?): String = if (value == null) "" else String.format(Locale.US, "%.3f", value)
          }
          '''.replace("          ", ""))

          # --- Ore chunk planning: don't fill or invalidate the empty rectangle around a curved deposit. ---
          Path("app/src/main/java/com/mineit/minegame/ui/render/OreChunkPlanner.kt").write_text('''package com.mineit.minegame.ui.render

          import com.mineit.minegame.domain.MinePoint3D
          import com.mineit.minegame.domain.MineWorldBounds
          import com.mineit.minegame.domain.MineWorldGeometry
          import com.mineit.minegame.domain.OreBody
          import com.mineit.minegame.domain.OreBodyNode
          import com.mineit.minegame.domain.TunnelSegment
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.min

          /** Fixed-size render chunks for remaining-ore meshes. */
          internal data class OreChunkKey(
              val bodyId: String,
              val x: Int,
              val y: Int,
              val z: Int,
          ) {
              fun bounds(): MineWorldBounds {
                  val size = OreChunkPlanner.CHUNK_SIZE_METRES
                  return MineWorldBounds(
                      minX = x * size,
                      maxX = (x + 1) * size,
                      minY = y * size,
                      maxY = (y + 1) * size,
                      minZ = z * size,
                      maxZ = (z + 1) * size,
                  )
              }
          }

          /** Disposable render-cache partitioning around the canonical domain deposit field. */
          internal object OreChunkPlanner {
              const val CHUNK_SIZE_METRES = 12f

              fun chunksForBody(body: OreBody, worldBounds: MineWorldBounds): Set<OreChunkKey> {
                  val bodyBounds = bodyBounds(body) ?: return emptySet()
                  val clipped = intersect(bodyBounds, worldBounds) ?: return emptySet()
                  return keysForBounds(body.id, clipped).filterTo(linkedSetOf()) { key ->
                      bodyEnvelopeTouchesBounds(body, key.bounds())
                  }
              }

              fun affectedChunks(
                  segment: TunnelSegment,
                  tunnelRadiusMetres: Float,
                  body: OreBody,
                  worldBounds: MineWorldBounds,
                  extraPaddingMetres: Float,
              ): Set<OreChunkKey> {
                  val bodyBounds = bodyBounds(body) ?: return emptySet()
                  val padding = tunnelRadiusMetres + extraPaddingMetres
                  val cutBounds = MineWorldBounds(
                      minX = min(segment.start.x, segment.end.x) - padding,
                      maxX = max(segment.start.x, segment.end.x) + padding,
                      minY = min(segment.start.y, segment.end.y) - padding,
                      maxY = max(segment.start.y, segment.end.y) + padding,
                      minZ = min(segment.start.z, segment.end.z) - padding,
                      maxZ = max(segment.start.z, segment.end.z) + padding,
                  )
                  val clippedToBody = intersect(cutBounds, bodyBounds) ?: return emptySet()
                  val clippedToWorld = intersect(clippedToBody, worldBounds) ?: return emptySet()
                  return keysForBounds(body.id, clippedToWorld).filterTo(linkedSetOf()) { key ->
                      bodyEnvelopeTouchesBoth(body, cutBounds, key.bounds())
                  }
              }

              fun bodyBounds(body: OreBody): MineWorldBounds? = MineWorldGeometry.oreBodyBounds(body)

              fun chunkCentre(key: OreChunkKey): MinePoint3D = key.bounds().centre

              private fun bodyEnvelopeTouchesBounds(body: OreBody, bounds: MineWorldBounds): Boolean {
                  if (body.nodes.size == 1) return intersects(nodeBounds(body.nodes.single()), bounds)
                  for (index in 0 until body.nodes.lastIndex) {
                      if (intersects(segmentEnvelope(body.nodes[index], body.nodes[index + 1]), bounds)) return true
                  }
                  return false
              }

              private fun bodyEnvelopeTouchesBoth(
                  body: OreBody,
                  first: MineWorldBounds,
                  second: MineWorldBounds,
              ): Boolean {
                  if (body.nodes.size == 1) {
                      val envelope = nodeBounds(body.nodes.single())
                      return intersects(envelope, first) && intersects(envelope, second)
                  }
                  for (index in 0 until body.nodes.lastIndex) {
                      val envelope = segmentEnvelope(body.nodes[index], body.nodes[index + 1])
                      if (intersects(envelope, first) && intersects(envelope, second)) return true
                  }
                  return false
              }

              private fun segmentEnvelope(start: OreBodyNode, end: OreBodyNode): MineWorldBounds {
                  val radius = max(start.radiusMetres, end.radiusMetres)
                  return MineWorldBounds(
                      minX = min(start.centre.x, end.centre.x) - radius,
                      maxX = max(start.centre.x, end.centre.x) + radius,
                      minY = min(start.centre.y, end.centre.y) - radius,
                      maxY = max(start.centre.y, end.centre.y) + radius,
                      minZ = min(start.centre.z, end.centre.z) - radius,
                      maxZ = max(start.centre.z, end.centre.z) + radius,
                  )
              }

              private fun nodeBounds(node: OreBodyNode) = MineWorldBounds(
                  minX = node.centre.x - node.radiusMetres,
                  maxX = node.centre.x + node.radiusMetres,
                  minY = node.centre.y - node.radiusMetres,
                  maxY = node.centre.y + node.radiusMetres,
                  minZ = node.centre.z - node.radiusMetres,
                  maxZ = node.centre.z + node.radiusMetres,
              )

              private fun keysForBounds(bodyId: String, bounds: MineWorldBounds): Set<OreChunkKey> {
                  val size = CHUNK_SIZE_METRES
                  val epsilon = 0.0001f
                  val fromX = floor(bounds.minX / size).toInt()
                  val toX = floor((bounds.maxX - epsilon) / size).toInt()
                  val fromY = floor(bounds.minY / size).toInt()
                  val toY = floor((bounds.maxY - epsilon) / size).toInt()
                  val fromZ = floor(bounds.minZ / size).toInt()
                  val toZ = floor((bounds.maxZ - epsilon) / size).toInt()
                  if (fromX > toX || fromY > toY || fromZ > toZ) return emptySet()

                  return buildSet {
                      for (z in fromZ..toZ) {
                          for (y in fromY..toY) {
                              for (x in fromX..toX) {
                                  add(OreChunkKey(bodyId = bodyId, x = x, y = y, z = z))
                              }
                          }
                      }
                  }
              }

              private fun intersects(a: MineWorldBounds, b: MineWorldBounds): Boolean =
                  a.maxX >= b.minX && a.minX <= b.maxX &&
                      a.maxY >= b.minY && a.minY <= b.maxY &&
                      a.maxZ >= b.minZ && a.minZ <= b.maxZ

              internal fun intersect(a: MineWorldBounds, b: MineWorldBounds): MineWorldBounds? {
                  val minX = max(a.minX, b.minX)
                  val maxX = min(a.maxX, b.maxX)
                  val minY = max(a.minY, b.minY)
                  val maxY = min(a.maxY, b.maxY)
                  val minZ = max(a.minZ, b.minZ)
                  val maxZ = min(a.maxZ, b.maxZ)
                  if (minX >= maxX || minY >= maxY || minZ >= maxZ) return null
                  return MineWorldBounds(minX, maxX, minY, maxY, minZ, maxZ)
              }
          }
