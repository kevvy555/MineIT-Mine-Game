name: Apply Ore Mesh Refinement

on:
  push:
    branches: [feature/ore-mesh-refinement]
    paths: [.github/workflows/apply-ore-refinement.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ore-mesh-refinement
      - name: Apply refinement
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_ore_refinement.py
          python /tmp/apply_ore_refinement.py
      - name: Commit refinement
        run: |
          git config user.name "kevvy555"
          git config user.email "kevvy555@googlemail.com"
          git add app README.md docs
          git commit -m "perf: localize subtractive ore remeshing"
          git push origin HEAD:feature/ore-mesh-refinement
