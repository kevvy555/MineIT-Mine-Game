name: Apply Live Ore Diagnostics

on:
  push:
    branches:
      - feature/live-ore-diagnostics
    paths:
      - .github/workflows/apply-live-ore-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-ore-diagnostics
          fetch-depth: 0
      - name: Apply refinement
        run: python3 .github/scripts/apply_live_ore_diagnostics.py
      - name: Commit refinement
        run: |
          git config user.name "kevvy555"
          git config user.email "kevvy555@googlemail.com"
          git add app README.md
          git commit -m "perf: add live ore updates and diagnostic capture"
          git push origin HEAD:feature/live-ore-diagnostics
